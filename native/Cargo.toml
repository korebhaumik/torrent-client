[package]
name = "torrent-desktop"
version = "2.1.0"
edition = "2024"
description = "Standalone native macOS torrent client"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
html-escape = "0.2"
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
open = "5"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
sha1 = "0.10"
tempfile = "3"
